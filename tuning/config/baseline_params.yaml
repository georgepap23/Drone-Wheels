# Baseline hardware parameters.
# Applied at the start of every test run, so each test begins from the same state.
# Values equal to ArduPilot's defaults are set explicitly so the baseline is written down.
# Check every name in QGroundControl (Vehicle Setup -> Parameters) before the first run.

# Frame: quadcopter, X layout (the Iris model in SITL). Reboot required if changed.
FRAME_CLASS: 1
FRAME_TYPE: 1   # 1 = X (0 would be Plus)

# Motor outputs (ESC pulse range, microseconds). Typical brushless ESC values.
MOT_PWM_MIN: 1000
MOT_PWM_MAX: 2000

# Motor spin-up thresholds (fraction of full throttle).
MOT_SPIN_ARM: 0.10
MOT_SPIN_MIN: 0.15

# Battery monitor: analog-style monitor (value 4 in SITL).
# TODO: BATT_CAPACITY must match the real 6S pack from the BOM once it is chosen.
BATT_MONITOR: 4
BATT_CAPACITY: 3300

# Estimator: use EKF3 (ArduPilot's current state estimator).
EK3_ENABLE: 1

# ---- Tuning step 0 (prerequisites), 2026-11-27 ----
# Thrust curve linearisation. The sim rotor speed is 0.15..0.95 of max over the throttle
# range and LiftDrag thrust ~ speed^2; the least-squares fit of ArduPilot's
# (1-e)*u + e*u^2 to that curve gives e = 0.65 (max error 2.5 %). Real vehicle: from a thrust stand.
MOT_THST_EXPO: 0.65
MOT_HOVER_LEARN: 2      # learn MOT_THST_HOVER while hovering, save it on disarm

# Log the rate/attitude/PID messages at the full 400 Hz loop rate (bit 0 = Fast Attitude).
LOG_BITMASK: 180223

# Sensor noise for the MicoAir743 V2. The gyro and accel noise come from the Gazebo IMU
# in model.sdf (already BMI088 values). Baro: SPL06 at 8x oversampling ~0.14 m RMS;
# SITL adds uniform noise in [-RND, +RND], RMS = RND/sqrt(3) -> RND = 0.24 m.
SIM_BARO_RND: 0.24
SIM_GPS1_HZ: 5          # MicoAir M10 GPS output rate

# Start a new log file at every disarm, so each test run gets its own .BIN
# (otherwise SITL appends every flight to the same file until it reboots).
LOG_FILE_DSRMROT: 1
